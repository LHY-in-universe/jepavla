dataset:
  backend: lerobot
  lerobot:
    action_key: action
    decode_video: true
    episode_cache_size: 8
    frame_key: observation.images.image
    states_key: observation.state
    use_stats_norm: true
  split:
    val_ratio: 0.1
model:
  action_dim: 4
  action_horizon: 30
  dropout: 0.1
  flow_hidden_dim: 1024
  flow_num_layers: 4
  flow_solver_steps: 24
  flow_time_embed_dim: 128
  jepa_target_dim: 1024
  lambda_action: 1.0
  lambda_jepa_pred: 1.0
  model_dim: 512
  num_heads: 8
  rtc_execute_steps: 20
  rtc_execution_horizon: 10
  rtc_max_guidance_weight: 10.0
  sparse_hist_slots: 4
  state_dim: 4
  state_embed_dim: 128
  action_embed_dim: 128
  sparse_image_dim: 256
  vl_in_dim: 2048
  vl_guidance_dropout: 0.1
  use_online_vjepa2: true
  use_dino: false
  scheduler:
    fps: 30
    actions_per_frame: 1
    vl_refresh_frames: 90
    jepa_refresh_frames: 10
    jepa_window_frames: 30
    robot_hist_frame_offsets: [30, 20, 10, 1]
  vjepa2:
    model_name_or_path: ""
    image_size: 224
    dtype: bf16
    freeze_backbone: true
    freeze_target: true
    allow_mock_runner: false
runtime:
  device: cuda
  eval_batches: 50
  grad_clip_norm: 1.0
  log_every: 100
  num_workers: 1
  outdir: outputs
  precision: bf16
  save_every: 5000
  seed: 42
stages:
  A:
    eval_every_steps: 5000
    global_batch_size: 8
    loss:
      lambda_action: 0.0
      lambda_jepa_pred: 1.0
      optimize_action: false
      optimize_jepa_pred: true
    steps: 250000
  B:
    eval_every_steps: 5000
    global_batch_size: 8
    loss:
      lambda_action: 1.0
      lambda_jepa_pred: 0.2
      optimize_action: true
      optimize_jepa_pred: true
    steps: 200000
  C:
    eval_every_steps: 5000
    global_batch_size: 8
    loss:
      lambda_action: 1.0
      lambda_jepa_pred: 0.5
      optimize_action: true
      optimize_jepa_pred: true
    steps: 150000
task_filter:
  hard_tasks_json: ''
  level: hard
  mt50_order_json: ''
